<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ShopEasy — E-Commerce</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b10;--surface:#0d1117;--card:#111820;--border:#1e2d3d;
  --accent:#00d4ff;--accent2:#7c3aed;--green:#10b981;--red:#ef4444;
  --text:#cdd9e5;--muted:#768da3;--white:#e8f0f8;
  --font:'Outfit',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.02) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(8,11,16,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:1rem 4%;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{font-size:1.3rem;font-weight:800;color:var(--white);letter-spacing:-0.02em}
.logo span{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:1rem}
.search-box{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.5rem 1rem;gap:0.5rem}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:0.88rem;width:200px}
.search-box input::placeholder{color:var(--muted)}
.cart-btn{position:relative;background:var(--accent);color:#000;border:none;border-radius:8px;padding:0.55rem 1.2rem;font-weight:700;font-size:0.88rem;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:0.5rem;transition:all 0.2s}
.cart-btn:hover{background:#33ddff;transform:translateY(-1px)}
.cart-count{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-size:0.65rem;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* HERO BANNER */
.banner{background:linear-gradient(135deg,#0d1117 0%,#111827 100%);border-bottom:1px solid var(--border);padding:3rem 4%;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;z-index:1}
.banner::before{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,0.12),transparent 70%);top:-100px;right:0;pointer-events:none}
.banner-text h1{font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:800;color:var(--white);letter-spacing:-0.02em;line-height:1.15}
.banner-text h1 span{color:var(--accent)}
.banner-text p{color:var(--muted);margin-top:0.7rem;font-size:0.95rem}
.banner-badge{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.25);border-radius:8px;padding:1rem 1.5rem;text-align:center}
.badge-num{font-size:2rem;font-weight:800;color:var(--accent)}
.badge-label{font-size:0.75rem;color:var(--muted);margin-top:0.2rem}

/* FILTERS */
.filters{padding:1.5rem 4%;display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center;position:relative;z-index:1;border-bottom:1px solid var(--border)}
.filter-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:100px;padding:0.4rem 1rem;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:var(--font)}
.filter-btn:hover,.filter-btn.active{background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.4);color:var(--accent)}
.filter-label{font-size:0.8rem;color:var(--muted);margin-right:0.3rem}

/* PRODUCTS */
.products-section{padding:2rem 4%;position:relative;z-index:1}
.section-title{font-size:1.1rem;font-weight:700;color:var(--white);margin-bottom:1.5rem;display:flex;align-items:center;gap:0.6rem}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.4rem}

.product-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform 0.25s,box-shadow 0.25s,border-color 0.25s;cursor:pointer}
.product-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,0.4);border-color:rgba(0,212,255,0.2)}
.product-img{height:180px;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative;background:var(--surface)}
.product-badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:0.65rem;font-weight:800;padding:0.2rem 0.55rem;border-radius:4px}
.product-badge.new{background:var(--green)}
.product-info{padding:1.1rem}
.product-cat{font-size:0.68rem;font-weight:700;color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:0.3rem}
.product-name{font-size:0.95rem;font-weight:700;color:var(--white);margin-bottom:0.4rem}
.product-rating{display:flex;align-items:center;gap:0.3rem;font-size:0.75rem;color:var(--muted);margin-bottom:0.8rem}
.stars{color:#f59e0b}
.product-footer{display:flex;align-items:center;justify-content:space-between}
.price{font-size:1.15rem;font-weight:800;color:var(--white)}
.price .old{font-size:0.78rem;color:var(--muted);text-decoration:line-through;margin-left:0.4rem;font-weight:400}
.add-btn{background:var(--accent);border:none;color:#000;border-radius:8px;padding:0.45rem 0.9rem;font-size:0.8rem;font-weight:700;cursor:pointer;font-family:var(--font);transition:all 0.2s}
.add-btn:hover{background:#33ddff;transform:scale(1.05)}
.add-btn.added{background:var(--green);color:#fff}

/* CART SIDEBAR */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:500;opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(4px)}
.cart-overlay.open{opacity:1;pointer-events:all}
.cart-sidebar{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:501;transition:right 0.35s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;overflow:hidden}
.cart-sidebar.open{right:0}
.cart-head{padding:1.4rem 1.6rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cart-head h2{font-size:1.1rem;font-weight:800;color:var(--white)}
.close-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.close-btn:hover{border-color:var(--accent);color:var(--accent)}
.cart-items{flex:1;overflow-y:auto;padding:1rem 1.6rem;display:flex;flex-direction:column;gap:1rem}
.cart-items::-webkit-scrollbar{width:4px}
.cart-items::-webkit-scrollbar-track{background:var(--card)}
.cart-items::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.cart-empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.cart-empty .empty-icon{font-size:3rem;margin-bottom:1rem}
.cart-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0.9rem 1rem;display:flex;gap:0.9rem;align-items:center}
.ci-icon{font-size:1.8rem;width:46px;height:46px;background:var(--surface);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ci-info{flex:1}
.ci-name{font-size:0.85rem;font-weight:600;color:var(--white);margin-bottom:0.2rem}
.ci-price{font-size:0.82rem;color:var(--accent);font-weight:700}
.ci-qty{display:flex;align-items:center;gap:0.5rem;margin-top:0.4rem}
.qty-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.qty-btn:hover{border-color:var(--accent);color:var(--accent)}
.qty-num{font-size:0.82rem;font-weight:700;color:var(--white);min-width:20px;text-align:center}
.ci-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0.2rem;transition:color 0.2s}
.ci-remove:hover{color:var(--red)}
.cart-footer{padding:1.4rem 1.6rem;border-top:1px solid var(--border)}
.cart-totals{margin-bottom:1.2rem}
.total-row{display:flex;justify-content:space-between;font-size:0.85rem;color:var(--muted);margin-bottom:0.5rem}
.total-row.grand{color:var(--white);font-weight:800;font-size:1rem;padding-top:0.6rem;border-top:1px solid var(--border);margin-top:0.6rem}
.checkout-btn{width:100%;background:var(--accent);border:none;color:#000;border-radius:10px;padding:0.9rem;font-size:0.95rem;font-weight:800;cursor:pointer;font-family:var(--font);transition:all 0.2s}
.checkout-btn:hover{background:#33ddff;transform:translateY(-1px)}

/* TOAST */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--green);color:#fff;padding:0.7rem 1.5rem;border-radius:100px;font-size:0.85rem;font-weight:700;z-index:999;transition:transform 0.3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* CHECKOUT MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:600;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem;max-width:420px;width:90%;text-align:center}
.modal h2{font-size:1.4rem;font-weight:800;color:var(--white);margin-bottom:0.5rem}
.modal p{color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem}
.modal-icon{font-size:3.5rem;margin-bottom:1rem}
.modal-btn{background:var(--accent);border:none;color:#000;border-radius:10px;padding:0.8rem 2rem;font-size:0.9rem;font-weight:800;cursor:pointer;font-family:var(--font);transition:all 0.2s}
.modal-btn:hover{background:#33ddff}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo">Shop<span>Easy</span></div>
  <div class="nav-right">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search products..." oninput="filterProducts()"/>
    </div>
    <button class="cart-btn" onclick="toggleCart()">
      🛒 Cart
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</nav>

<!-- BANNER -->
<div class="banner">
  <div class="banner-text">
    <h1>Shop the <span>Latest</span><br>Tech & More</h1>
    <p>Free shipping on orders above ₹999 · Easy returns</p>
  </div>
  <div class="banner-badge">
    <div class="badge-num">50+</div>
    <div class="badge-label">Products Available</div>
  </div>
</div>

<!-- FILTERS -->
<div class="filters">
  <span class="filter-label">Filter:</span>
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('electronics',this)">Electronics</button>
  <button class="filter-btn" onclick="setFilter('fashion',this)">Fashion</button>
  <button class="filter-btn" onclick="setFilter('books',this)">Books</button>
  <button class="filter-btn" onclick="setFilter('home',this)">Home</button>
</div>

<!-- PRODUCTS -->
<div class="products-section">
  <div class="section-title">Featured Products</div>
  <div class="products-grid" id="productsGrid"></div>
</div>

<!-- CART SIDEBAR -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-head">
    <h2>🛒 Your Cart</h2>
    <button class="close-btn" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-totals" id="cartTotals"></div>
    <button class="checkout-btn" onclick="checkout()">Proceed to Checkout →</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <h2>Order Placed!</h2>
    <p>Your order has been successfully placed.<br>Expected delivery in 3-5 business days.</p>
    <button class="modal-btn" onclick="closeModal()">Continue Shopping</button>
  </div>
</div>

<script>
const PRODUCTS = [
  {id:1,name:"Wireless Earbuds Pro",cat:"electronics",price:2499,old:3999,emoji:"🎧",rating:4.5,reviews:128,badge:"SALE"},
  {id:2,name:"Mechanical Keyboard",cat:"electronics",price:4999,old:null,emoji:"⌨️",rating:4.8,reviews:94,badge:"NEW"},
  {id:3,name:"Smart Watch Series 5",cat:"electronics",price:8999,old:11999,emoji:"⌚",rating:4.6,reviews:203,badge:"SALE"},
  {id:4,name:"USB-C Hub 7-in-1",cat:"electronics",price:1799,old:null,emoji:"🔌",rating:4.3,reviews:67},
  {id:5,name:"Classic White Sneakers",cat:"fashion",price:1499,old:2499,emoji:"👟",rating:4.4,reviews:312,badge:"SALE"},
  {id:6,name:"Denim Jacket",cat:"fashion",price:2199,old:null,emoji:"🧥",rating:4.2,reviews:89,badge:"NEW"},
  {id:7,name:"Leather Wallet",cat:"fashion",price:799,old:1299,emoji:"👜",rating:4.7,reviews:156,badge:"SALE"},
  {id:8,name:"Clean Code — Book",cat:"books",price:599,old:null,emoji:"📗",rating:4.9,reviews:445},
  {id:9,name:"The Pragmatic Programmer",cat:"books",price:649,old:null,emoji:"📘",rating:4.8,reviews:389},
  {id:10,name:"JavaScript: The Good Parts",cat:"books",price:499,old:749,emoji:"📙",rating:4.6,reviews:278,badge:"SALE"},
  {id:11,name:"Desk Organizer Set",cat:"home",price:899,old:null,emoji:"🗂️",rating:4.3,reviews:112,badge:"NEW"},
  {id:12,name:"LED Desk Lamp",cat:"home",price:1299,old:1799,emoji:"💡",rating:4.5,reviews:88,badge:"SALE"},
];

let cart = [];
let currentFilter = 'all';
let searchQuery = '';

function renderProducts() {
  const grid = document.getElementById('productsGrid');
  const filtered = PRODUCTS.filter(p => {
    const matchCat = currentFilter === 'all' || p.cat === currentFilter;
    const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
    return matchCat && matchSearch;
  });
  if (!filtered.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted)">No products found 😕</div>`;
    return;
  }
  grid.innerHTML = filtered.map(p => {
    const inCart = cart.find(c => c.id === p.id);
    return `
    <div class="product-card" onclick="addToCart(${p.id})">
      <div class="product-img">
        ${p.badge ? `<span class="product-badge ${p.badge==='NEW'?'new':''}">${p.badge}</span>` : ''}
        ${p.emoji}
      </div>
      <div class="product-info">
        <div class="product-cat">${p.cat}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-rating">
          <span class="stars">${'★'.repeat(Math.floor(p.rating))}${'☆'.repeat(5-Math.floor(p.rating))}</span>
          ${p.rating} (${p.reviews})
        </div>
        <div class="product-footer">
          <div class="price">
            ₹${p.price.toLocaleString()}
            ${p.old ? `<span class="old">₹${p.old.toLocaleString()}</span>` : ''}
          </div>
          <button class="add-btn ${inCart?'added':''}" onclick="event.stopPropagation();addToCart(${p.id})">
            ${inCart ? '✓ Added' : '+ Add'}
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function addToCart(id) {
  const product = PRODUCTS.find(p => p.id === id);
  const existing = cart.find(c => c.id === id);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({...product, qty: 1});
  }
  updateCart();
  showToast(`${product.emoji} ${product.name} added to cart!`);
  renderProducts();
}

function updateCart() {
  const count = cart.reduce((s,i) => s + i.qty, 0);
  document.getElementById('cartCount').textContent = count;
  renderCartItems();
}

function renderCartItems() {
  const el = document.getElementById('cartItems');
  if (!cart.length) {
    el.innerHTML = `<div class="cart-empty"><div class="empty-icon">🛒</div><p>Your cart is empty</p></div>`;
    document.getElementById('cartTotals').innerHTML = '';
    return;
  }
  el.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="ci-icon">${item.emoji}</div>
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">₹${(item.price * item.qty).toLocaleString()}</div>
        <div class="ci-qty">
          <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
        </div>
      </div>
      <button class="ci-remove" onclick="removeItem(${item.id})">🗑</button>
    </div>`).join('');
  const subtotal = cart.reduce((s,i) => s + i.price * i.qty, 0);
  const shipping = subtotal > 999 ? 0 : 99;
  const total = subtotal + shipping;
  document.getElementById('cartTotals').innerHTML = `
    <div class="total-row"><span>Subtotal</span><span>₹${subtotal.toLocaleString()}</span></div>
    <div class="total-row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color:var(--green)">FREE</span>' : '₹'+shipping}</span></div>
    <div class="total-row grand"><span>Total</span><span>₹${total.toLocaleString()}</span></div>`;
}

function changeQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
  updateCart();
  renderProducts();
}

function removeItem(id) {
  cart = cart.filter(c => c.id !== id);
  updateCart();
  renderProducts();
}

function toggleCart() {
  document.getElementById('cartSidebar').classList.toggle('open');
  document.getElementById('cartOverlay').classList.toggle('open');
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}

function filterProducts() {
  searchQuery = document.getElementById('searchInput').value;
  renderProducts();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function checkout() {
  if (!cart.length) return;
  cart = [];
  updateCart();
  toggleCart();
  renderProducts();
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

renderProducts();
</script>
</body>
</html>
